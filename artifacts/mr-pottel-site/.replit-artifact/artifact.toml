kind = "web"
previewPath = "/"
title = "Mr Pottel Restaurant"
description = "An official restaurant website refresh for Mr Pottel in Nizamabad, showcasing its farm-to-table lamb story, signature dishes, location, and contact details."
version = "1.0.0"
id = "artifacts/mr-pottel-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20916

[services.development]
run = "pnpm --filter @workspace/mr-pottel-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mr-pottel-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/mr-pottel-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20916"
BASE_PATH = "/"
